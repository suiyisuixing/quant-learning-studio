name: Product and repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QLAB_DB: /tmp/quantlab-test.sqlite
      QLAB_AI_KEY: ''
      QLAB_CN_TOKEN: ''
      QLAB_US_KEY: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install source-pinned project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run current application and governance tests
        run: python -m pytest -q
      - name: Run isolated loopback HTTP smoke with synthetic accounts
        run: python scripts/http_smoke.py

  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scope enforcement and publication guards
        run: python3 -m unittest discover -s tests/governance -v
      - name: Validate files, links and role registry
        run: python3 scripts/check_repository.py
      - name: Inspect tracked files and reachable publication history
        run: python3 scripts/publication_scan.py --history HEAD

