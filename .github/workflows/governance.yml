name: Trusted scope gate

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional open PR number to re-evaluate against trusted main policy
        required: false
        type: string

permissions:
  contents: read

jobs:
  scope-evaluator:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # On pull_request_target, both workflow and checkout come from trusted
      # default-branch code. Never check out a PR head/merge or execute its files.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test trusted policy evaluator
        run: python3 -m unittest discover -s tests/governance -v
      - name: Publish immutable-author and approved-path result on PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_scope.py
