name: F1—F4 功能任务
description: 实际模块任务与验收，不预填成果
title: "[TASK] 一个可验收的功能步骤"
labels: ["type:development", "status:todo"]
body:
  - type: dropdown
    id: feature
    attributes:
      label: 功能
      options: [F1 市场数据显示, F2 演练前策划, F3 虚拟沙盘, F4 问题复盘, 支撑能力与公共接口]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 主责人、批准计划、输入输出、依赖、文件路径与验收
    validations:
      required: true
